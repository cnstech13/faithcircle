<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1f3a"><title>FaithCircle | Moderation</title>
<style>
:root{--navy:#0b1f3a;--blue:#1769ff;--aqua:#35e0d0;--bg:#f3f6fb;--ink:#17243a;--muted:#68758a;--line:#e3e9f2;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:var(--navy);color:white;padding:22px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--aqua)}main{max-width:1100px;margin:28px auto;padding:0 16px}.intro,.panel,.report{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 20px #102b4b0a}.intro{margin-bottom:18px}.intro h1{margin:0 0 6px;font-size:25px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar select,.toolbar button,.report select,.report textarea,.report button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.toolbar button,.primary{background:var(--blue)!important;color:white;border-color:var(--blue)!important;cursor:pointer}.reports{display:grid;gap:12px}.report-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#edf3ff;color:#164eb3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.report p{overflow-wrap:anywhere}.report label{display:block;font-weight:650;margin:12px 0 5px}.report textarea{width:100%;min-height:65px}.report select{max-width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{cursor:pointer}.danger{color:var(--red)}#notice{padding:12px;border-radius:10px;margin:12px 0;display:none;background:#fff1f0;color:#8c1d18}#notice.ok{background:#e8fbf5;color:#116149}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.intro,.panel,.report{padding:15px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
</head><body><header class="top"><div class="brand">✝ Faith<span>Circle</span></div><div>Community moderation</div></header>
<main><section class="intro"><h1>Moderation queue</h1><div class="muted">Review reports respectfully and consistently. This page does not automatically delete reported content or suspend accounts.</div><div id="notice" role="status"></div><div class="toolbar"><select id="statusFilter" aria-label="Filter reports"><option value="pending">Pending</option><option value="reviewing">Reviewing</option><option value="action_taken">Action taken</option><option value="dismissed">Dismissed</option><option value="all">All reports</option></select><button id="refresh">Refresh queue</button></div></section>
<section class="panel"><div id="reports" class="reports"><div class="empty">Sign-in and moderator permission are required.</div></div></section></main>
<script>
(function(){'use strict';const client=window.supabaseClient;const list=document.getElementById('reports'),notice=document.getElementById('notice');function message(t,ok=false){notice.textContent=t;notice.className=ok?'ok':'';notice.style.display='block'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(s){return String(s||'').replaceAll('_',' ')}
async function load(){list.innerHTML='<div class="empty">Loading reports…</div>';notice.style.display='none';if(!client){message('Supabase is not configured.');return}const {data:{user},error:ae}=await client.auth.getUser();if(ae||!user){list.innerHTML='<div class="empty">Please sign in with your FaithCircle moderator account, then reload this page.</div>';return}const {data:mod,error:me}=await client.from('faithcircle_moderators').select('user_id').eq('user_id',user.id).maybeSingle();if(me||!mod){list.innerHTML='<div class="empty">Your account is not registered as a moderator. Ask the project owner to add your Auth user UUID to <code>faithcircle_moderators</code>.</div>';return}let q=client.from('faithcircle_content_reports').select('*').order('created_at',{ascending:false}).limit(200);const f=document.getElementById('statusFilter').value;if(f!=='all')q=q.eq('status',f);const {data,error}=await q;if(error){list.innerHTML='';message('Could not load reports. Confirm the moderation SQL migration was run.');return}if(!data?.length){list.innerHTML='<div class="empty">No reports in this view. Thank you for helping keep FaithCircle safe.</div>';return}list.innerHTML=data.map(r=>`<article class="report" data-id="${esc(r.id)}"><div class="report-head"><strong>${esc(label(r.target_type))} · ${esc(r.target_id)}</strong><span class="pill">${esc(label(r.status))}</span></div><p><strong>Reason:</strong> ${esc(label(r.reason))}</p><p><strong>Report details:</strong> ${esc(r.details||'No additional details provided.')}</p><p class="muted">Submitted ${esc(new Date(r.created_at).toLocaleString())} · Reporter ${esc(r.reporter_id)}</p><label>Status</label><select class="newstatus"><option value="pending" ${r.status==='pending'?'selected':''}>Pending</option><option value="reviewing" ${r.status==='reviewing'?'selected':''}>Reviewing</option><option value="action_taken" ${r.status==='action_taken'?'selected':''}>Action taken</option><option value="dismissed" ${r.status==='dismissed'?'selected':''}>Dismissed</option></select><label>Moderator notes</label><textarea class="notes" maxlength="4000" placeholder="Record the decision and reasoning">${esc(r.moderator_notes||'')}</textarea><div class="actions"><button class="primary save">Save review</button></div></article>`).join('');list.querySelectorAll('.save').forEach(btn=>btn.addEventListener('click',async()=>{const card=btn.closest('.report');const id=card.dataset.id;const status=card.querySelector('.newstatus').value;const notes=card.querySelector('.notes').value.trim();btn.disabled=true;const {error}=await client.from('faithcircle_content_reports').update({status,moderator_notes:notes,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);btn.disabled=false;if(error){message('Could not save review. Check moderator permissions.');return}message('Review saved.',true);await load()}))}
document.getElementById('refresh').addEventListener('click',load);document.getElementById('statusFilter').addEventListener('change',load);load();})();
</script></body></html>
